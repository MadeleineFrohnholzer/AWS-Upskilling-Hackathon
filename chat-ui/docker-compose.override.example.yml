# ============================================================
# Local development overrides — NEVER commit real values here.
# ============================================================
# Copy to docker-compose.override.yml (already gitignored) and fill in your values.
# Docker Compose merges this file with docker-compose.yml automatically.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # edit docker-compose.override.yml with your values
#   docker compose up --build
# ============================================================

services:
  chat-ui:
    volumes:
      # Mount local AWS credentials so the container can call Bedrock/DynamoDB/Lambda
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      AWS_REGION: eu-central-1
      AWS_PROFILE: default        # or set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY below
      # AWS_ACCESS_KEY_ID: ""
      # AWS_SECRET_ACCESS_KEY: ""
      # AWS_SESSION_TOKEN: ""     # only needed for temporary credentials

      # Bedrock Agent — from: terraform -chdir=../terraform/team2 output bedrock_agent_id
      BEDROCK_AGENT_ID: ""
      BEDROCK_AGENT_ALIAS_ID: ""

      # Bedrock Knowledge Base — from: terraform -chdir=../terraform/team1 output knowledge_base_id
      BEDROCK_KB_ID: ""

      # DynamoDB — from: terraform -chdir=../terraform/team1 output chat_history_table_name
      DYNAMODB_TABLE_NAME: ""

      # Upload Lambda — from: terraform -chdir=../terraform/team1 output presigned_url_lambda_name
      UPLOAD_LAMBDA_NAME: ""
