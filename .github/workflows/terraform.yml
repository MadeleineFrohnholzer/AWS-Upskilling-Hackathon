name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  push:
    branches: [main]
    paths: ['terraform/**']

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect which team directories changed
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      team1: ${{ steps.filter.outputs.team1 }}
      team2: ${{ steps.filter.outputs.team2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'terraform/shared/**'
              - 'terraform/modules/networking/**'
            team1:
              - 'terraform/team1/**'
              - 'terraform/modules/storage/**'
            team2:
              - 'terraform/team2/**'
              - 'terraform/modules/compute/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # Plan (on PR)
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan: ${{ matrix.stack }}"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: changes
    strategy:
      matrix:
        include:
          - stack: shared
            dir: terraform/shared
            changed: ${{ needs.changes.outputs.shared }}
          - stack: team1
            dir: terraform/team1
            changed: ${{ needs.changes.outputs.team1 }}
          - stack: team2
            dir: terraform/team2
            changed: ${{ needs.changes.outputs.team2 }}
      fail-fast: false

    steps:
      - if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - if: matrix.changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - if: matrix.changed == 'true'
        name: Terraform Init
        working-directory: ${{ matrix.dir }}
        run: terraform init -input=false

      - if: matrix.changed == 'true'
        name: Terraform Format Check
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive -diff

      - if: matrix.changed == 'true'
        name: Terraform Validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

      - if: matrix.changed == 'true'
        name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.dir }}
        run: terraform plan -input=false -no-color
        continue-on-error: true

      - if: matrix.changed == 'true'
        name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 📋 Terraform Plan — \`${{ matrix.stack }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - if: matrix.changed == 'true' && steps.plan.outcome == 'failure'
        name: Plan Status
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Apply (on merge to main) — ordered: shared → team1 → team2
  # ─────────────────────────────────────────────────────────────────────────────
  apply-shared:
    name: "Apply: shared"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.shared == 'true'
    needs: changes
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '.sub, .aud'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init & Apply
        working-directory: terraform/shared
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply-team1:
    name: "Apply: team1"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.team1 == 'true'
    needs: [changes, apply-shared]
    # Run even if apply-shared was skipped (no shared changes)
    # but fail if apply-shared actually failed
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init & Apply
        working-directory: terraform/team1
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply-team2:
    name: "Apply: team2"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.team2 == 'true'
    needs: [changes, apply-shared]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init & Apply
        working-directory: terraform/team2
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
