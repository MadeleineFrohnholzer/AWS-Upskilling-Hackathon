name: Manage Cognito Users

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - list-users
          - create-user
      email:
        description: "User email (required for create-user)"
        required: false
      temporary_password:
        description: "Temporary password (required for create-user)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  manage-user:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: List Users
        if: github.event.inputs.action == 'list-users'
        run: |
          aws cognito-idp list-users \
            --user-pool-id eu-central-1_Vf130vVge \
            --region eu-central-1 \
            --query "Users[*].{Username:Username,Status:UserStatus,Email:Attributes[?Name=='email'].Value|[0]}" \
            --output table

      - name: Create User
        if: github.event.inputs.action == 'create-user'
        run: |
          aws cognito-idp admin-create-user \
            --user-pool-id eu-central-1_Vf130vVge \
            --username "${{ github.event.inputs.email }}" \
            --user-attributes Name=email,Value="${{ github.event.inputs.email }}" Name=email_verified,Value=true \
            --temporary-password "${{ github.event.inputs.temporary_password }}" \
            --region eu-central-1
          echo "User ${{ github.event.inputs.email }} created successfully"
