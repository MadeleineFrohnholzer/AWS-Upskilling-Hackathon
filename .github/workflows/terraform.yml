name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  push:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Plan (on PR)
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: "Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan -input=false -no-color
        continue-on-error: true
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.ENTRA_TENANT_ID }}
          TF_VAR_entra_client_id: ${{ secrets.ENTRA_CLIENT_ID }}
          TF_VAR_entra_client_secret: ${{ secrets.ENTRA_CLIENT_SECRET }}
          TF_VAR_cognito_callback_urls: '["${{ secrets.COGNITO_CALLBACK_URL }}"]'
          TF_VAR_alb_certificate_arn: ${{ secrets.TF_VAR_ALB_CERTIFICATE_ARN }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 📋 Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - if: steps.plan.outcome == 'failure'
        name: Plan Status
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Apply (on merge to main)
  # ─────────────────────────────────────────────────────────────────────────────
  apply:
    name: "Apply"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Import ALB certificate into ACM
        id: acm
        run: |
          echo "${{ secrets.ALB_CERT_PEM }}" > cert.pem
          echo "${{ secrets.ALB_KEY_PEM }}" > key.pem
          ARN=$(aws acm import-certificate \
            --certificate fileb://cert.pem \
            --private-key fileb://key.pem \
            --region eu-central-1 \
            --query CertificateArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT
          rm -f cert.pem key.pem

      - name: Init & Apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.TF_VAR_ENTRA_TENANT_ID }}
          TF_VAR_entra_client_id: ${{ secrets.TF_VAR_ENTRA_CLIENT_ID }}
          TF_VAR_entra_client_secret: ${{ secrets.TF_VAR_ENTRA_CLIENT_SECRET }}
          TF_VAR_cognito_callback_urls: ${{ secrets.TF_VAR_COGNITO_CALLBACK_URL }}
          TF_VAR_alb_certificate_arn: ${{ steps.acm.outputs.arn }}
