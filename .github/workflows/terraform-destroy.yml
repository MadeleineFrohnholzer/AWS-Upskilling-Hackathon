name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Guard: abort immediately if confirmation string is wrong
  # ─────────────────────────────────────────────────────────────────────────────
  guard:
    name: Confirm Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation failed. You must type 'destroy' exactly."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with destroy."

  # ─────────────────────────────────────────────────────────────────────────────
  # Destroy the unified stack
  # ─────────────────────────────────────────────────────────────────────────────
  destroy:
    name: "Destroy"
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init & Destroy
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve -refresh=false || {
            echo "First destroy attempt failed, removing stuck Bedrock resources from state and retrying..."
            terraform state list | grep -E "aws_bedrockagent_data_source|aws_bedrockagent_knowledge_base" | xargs -r terraform state rm
            terraform destroy -input=false -auto-approve
          }
        env:
          TF_VAR_entra_tenant_id: ${{ secrets.TF_VAR_ENTRA_TENANT_ID }}
          TF_VAR_entra_client_id: ${{ secrets.TF_VAR_ENTRA_CLIENT_ID }}
          TF_VAR_entra_client_secret: ${{ secrets.TF_VAR_ENTRA_CLIENT_SECRET }}
          TF_VAR_cognito_callback_urls: ${{ secrets.TF_VAR_COGNITO_CALLBACK_URL }}
